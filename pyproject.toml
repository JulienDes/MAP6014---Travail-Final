[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "map6014-house-prices"
version = "0.1.0"
description = "Travail universitaire MAP6014 : Kaggle House Prices"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<4",
    "matplotlib>=3.10.7,<4",
    "seaborn>=0.13.2,<1",
    "scipy>=1.16.1,<2",
    "scikit-learn>=1.8,<2",
    "ipykernel>=7.0.1,<8",
]

[project.optional-dependencies]
# Expériences RAG filtré (notebooks/experiences/01_rag_filtre.ipynb et 02_rag_filtre_v2.ipynb).
rag = [
    "chromadb>=1.5,<2",
    "sentence-transformers>=6,<7",
    "openai>=3.50,<4",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "tqdm>=4.67,<5",
    "ipywidgets>=8.1,<9",  # barres de progression tqdm dans Jupyter (IProgress)
]
# Expériences XGBoost et ensemble (notebooks/experiences/03_xgboost.ipynb et 04_ensemble.ipynb).
xgboost = [
    "xgboost>=3.1,<4",
]

[tool.setuptools.packages.find]
include = ["src*"]
